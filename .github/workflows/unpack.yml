name: Unpack uploaded zip

# Upload habitflow.zip to the main page of the repo (Add file → Upload files).
# This unpacks it into the repo, deletes the zip, and starts the APK build.
on:
  push:
    branches: [main]
    paths: ['habitflow.zip']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip over the repo (workflow files are left alone)
        run: |
          test -f habitflow.zip || { echo "habitflow.zip not found"; exit 1; }
          unzip -o habitflow.zip -x '.github/*'
          git rm -q --cached habitflow.zip || true
          rm -f habitflow.zip

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack habitflow.zip" || echo "Nothing changed"
          git push

      - name: Start the APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main || echo "Start 'Build Android APK' by hand in the Actions tab"
