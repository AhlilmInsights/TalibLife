# Builds an installable Android APK of HabitFlow every time you change the app on GitHub.
# Find the APK under: Releases (right side of your repo page) → newest "HabitFlow APK" → HabitFlow.apk
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'fonts/**'
      - 'vendor/**'
      - 'icons/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # needed to publish the APK as a Release

jobs:
  build:
    # pinned: ubuntu-latest is moving to Ubuntu 26 (Oct 2026), whose image may not carry the Android SDK
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node 22 (required by Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 (required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image normally has the Android SDK; install the parts Capacitor 8 needs (and the SDK itself if missing).
      - name: Set up the Android SDK
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKM=$(ls "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SDKM" ]; then
            echo "No Android SDK on this machine; downloading the command-line tools."
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;35.0.0" | grep -v "^\[" || true
          ls "$SDK" "$SDK/platforms" "$SDK/build-tools"

      - name: Copy the web app into www/
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          mkdir -p www
          for f in index.html manifest.json css js data fonts vendor icons; do
            [ -e "$f" ] || { echo "::error::'$f' is missing from the repository — upload habitflow.zip again."; exit 1; }
          done
          cp index.html manifest.json www/
          cp -r css js data fonts vendor icons www/

      - name: Create the Android project with Capacitor
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          npm init -y > /dev/null
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 \
            @capacitor/filesystem@8 @capacitor/share@8 @capacitor/local-notifications@8
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.habitflow.hifdh",
            "appName": "HabitFlow",
            "webDir": "www",
            "android": { "backgroundColor": "#0F1E1C" },
            "plugins": {
              "SystemBars": { "insetsHandling": "css" },
              "CapacitorHttp": { "enabled": true },
              "LocalNotifications": { "iconColor": "#C8A250" }
            }
          }
          EOF
          npx cap add android

      - name: Allow microphone (record & compare), location (prayer times) and on-time reminders
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          M=android/app/src/main/AndroidManifest.xml
          # exact alarms: Android 12+ otherwise delivers reminders whenever it suits the battery saver
          for p in RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED; do
            grep -q "android.permission.$p\"" "$M" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" "$M"
          done
          grep "uses-permission" "$M"

      - name: App icon (optional — build continues with the default icon if this fails)
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icons/icon-1024.png assets/icon-only.png
          cp icons/icon-1024.png assets/icon-foreground.png
          cp icons/icon-1024.png assets/splash.png
          cp icons/icon-1024.png assets/splash-dark.png
          npx --yes @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#10b981' --iconBackgroundColorDark '#10b981' \
            --splashBackgroundColor '#0F1E1C' --splashBackgroundColorDark '#0F1E1C'

      # @capacitor/assets writes adaptive icons that point to mipmap/ic_launcher_background but, with a plain
      # background colour, never creates that image, so resource linking fails. Point them at a colour instead.
      - name: Fix the adaptive icon background
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          RES=android/app/src/main/res
          if ! ls $RES/mipmap-*/ic_launcher_background.* > /dev/null 2>&1; then
            for f in $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml; do
              [ -f "$f" ] && sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' "$f"
            done
            mkdir -p $RES/values
            # never define the colour twice
            grep -l 'name="ic_launcher_background"' $RES/values/*.xml 2>/dev/null | grep -v '/ic_launcher_background.xml$' \
              | xargs -r sed -i '/name="ic_launcher_background"/d'
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#10b981</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
            echo "Adaptive icon now uses a colour background."
          fi
          cat $RES/mipmap-anydpi-v26/ic_launcher.xml || true

      # Same signing key on every build = the phone accepts updates without uninstalling (and losing data).
      # One-time setup: add the repository secret ANDROID_DEBUG_KEYSTORE_BASE64 (see README).
      - name: Use your fixed signing key (if you added the secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            # spaces or line breaks added while copy-pasting (common on a phone) are removed first
            if printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 --decode > /tmp/debug.keystore 2>/dev/null \
               && keytool -list -keystore /tmp/debug.keystore -storepass android > /dev/null 2>&1; then
              mv /tmp/debug.keystore ~/.android/debug.keystore
              # tell Gradle explicitly: it does not always look in ~/.android on the build machine
              cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  debug {
                      storeFile file("$HOME/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
              keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 SHA256 | sed 's/.*SHA256: //' > "$RUNNER_TEMP/key.sha256"
              echo "Using the saved signing key: $(cat "$RUNNER_TEMP/key.sha256" | cut -c1-23)…"
            else
              echo "::warning::The ANDROID_DEBUG_KEYSTORE_BASE64 secret is not a complete key (part of it was probably lost while pasting). Building with a random key instead — paste the secret again for future builds."
            fi
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_BASE64 secret — this APK gets a random key, so to install a later build you'd have to uninstall first (export a backup before you do!)."
          fi

      - name: Build the APK
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee -a build.log
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../HabitFlow.apk
          # check the APK really carries the saved key (so updates install over the old app)
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          GOT=$("$AS" verify --print-certs ../HabitFlow.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //' | tr -d ':' | tr a-z A-Z)
          WANT=$(tr -d ':' < "$RUNNER_TEMP/key.sha256" 2>/dev/null || true)
          if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
            echo "::error::The APK was not signed with the saved key (got $GOT)."; exit 1
          fi
          echo "::notice title=Signing key::${GOT:0:16}… $([ -n "$WANT" ] && echo '(the saved key)' || echo '(random key)')"

      # If anything above fails, put the reason in the "Annotations" box (easy to read on a phone).
      - name: Show why the build failed
        if: failure()
        run: |
          if [ -f build.log ]; then
            enc() { sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
            msg=$(grep -E -A8 "What went wrong|error:|ERROR|FAILURE|Could not|No such|not found" build.log | head -40 | enc)
            echo "::error title=Why the APK build failed::$msg"
            echo "::error title=Last lines of the build log::$(tail -30 build.log | enc)"
          else
            echo "::error title=Why the APK build failed::It stopped before the Gradle build — open the red step in the list of steps."
          fi

      - name: Keep a copy in the Actions run
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-apk
          path: HabitFlow.apk

      - name: Publish as a Release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: HabitFlow APK (build ${{ github.run_number }})
          body: Download HabitFlow.apk below on your Android phone and open it to install.
          files: HabitFlow.apk
          make_latest: true
